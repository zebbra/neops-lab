# Host-mode overlay: bundled Traefik on :80/:443 with path-prefix routing.
#
# Combined with the base stack via COMPOSE_FILE (see Makefile host-* targets):
#   docker-compose.yml:docker-compose.worker.yml:docker-compose.traefik.yml
#
# Laptop targets (local-*) never load this file. Requires LAB_HOST in .env
# (or the environment). Optional: LAB_SCHEME (default https).
# Let's Encrypt: set TRAEFIK_CERTRESOLVER=letsencrypt and TRAEFIK_ACME_EMAIL;
# the Makefile then also loads docker-compose.traefik-acme.yml. Otherwise
# Traefik serves its default self-signed certificate.
#
# Path map (Host(${LAB_HOST}) only — access by bare IP returns 404):
#   /cms      -> cms:8000          StripPrefix  (admin, graphql, static, file API)
#   /engine   -> workflow_engine   StripPrefix
#   /monitor  -> monitor app       no strip; Vite --base /monitor/
#   /         -> web_client        catch-all
#
# Host ports 8080 and 3031 are closed; 8001 and 3030 stay on loopback so
# apply_cms_config / wait_ready / run_workflow keep working unchanged.

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # ACME resolver is always registered; routers pick it up via
      # docker-compose.traefik-acme.yml when TRAEFIK_CERTRESOLVER is set.
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-noreply@localhost}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    depends_on:
      cms:
        condition: service_healthy
      web_client:
        condition: service_healthy
      workflow_engine:
        condition: service_healthy

  cms:
    environment:
      # Django builds absolute paths (/cms/admin, /cms/static, /cms/graphql)
      # while Traefik strips /cms before the request reaches the container.
      - FORCE_SCRIPT_NAME=/cms
      - CSRF_TRUSTED_ORIGINS=${LAB_SCHEME:-https}://${LAB_HOST}
      - USE_X_FORWARDED_HOST=True
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
    volumes: !override
      - ./cms/oidc-config.host.json:/etc/neops/oidc-config.json:ro
      - ./cms/jwt:/etc/neops/jwt:ro
    ports: !override
      - "127.0.0.1:8001:8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.cms.rule=Host(`${LAB_HOST}`) && PathPrefix(`/cms`)
      - traefik.http.routers.cms.entrypoints=websecure
      - traefik.http.routers.cms.priority=100
      - traefik.http.routers.cms.tls=true
      - traefik.http.routers.cms.middlewares=cms-strip
      - traefik.http.middlewares.cms-strip.stripprefix.prefixes=/cms
      - traefik.http.services.cms.loadbalancer.server.port=8000

  workflow_engine:
    ports: !override
      - "127.0.0.1:3030:3030"
    labels:
      - traefik.enable=true
      - traefik.http.routers.engine.rule=Host(`${LAB_HOST}`) && PathPrefix(`/engine`)
      - traefik.http.routers.engine.entrypoints=websecure
      - traefik.http.routers.engine.priority=100
      - traefik.http.routers.engine.tls=true
      - traefik.http.routers.engine.middlewares=engine-strip
      - traefik.http.middlewares.engine-strip.stripprefix.prefixes=/engine
      - traefik.http.services.engine.loadbalancer.server.port=3030

  workflow-engine-client:
    # Serve under /monitor so Traefik can PathPrefix-match without stripping;
    # the Vite base path must match the public URL prefix.
    # PUBLIC_ENGINE_URL / VITE_ENGINE_URL are passed when the image supports
    # them; otherwise open Settings and set the engine to
    # ${LAB_SCHEME}://${LAB_HOST}/engine after first load.
    environment:
      PUBLIC_ENGINE_URL: ${LAB_SCHEME:-https}://${LAB_HOST}/engine
      VITE_ENGINE_URL: ${LAB_SCHEME:-https}://${LAB_HOST}/engine
    ports: !reset []
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --base /monitor/ --allowedHosts ${LAB_HOST}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.monitor.rule=Host(`${LAB_HOST}`) && PathPrefix(`/monitor`)
      - traefik.http.routers.monitor.entrypoints=websecure
      - traefik.http.routers.monitor.priority=100
      - traefik.http.routers.monitor.tls=true
      - traefik.http.services.monitor.loadbalancer.server.port=5173

  web_client:
    environment:
      FRONTEND_GRAPHQL_ENDPOINT: ${LAB_SCHEME:-https}://${LAB_HOST}/cms/graphql
      FRONTEND_FILEAPI_ENDPOINT: ${LAB_SCHEME:-https}://${LAB_HOST}/cms/
      FRONTEND_DEVMODE: "true"
      FRONTEND_WORKFLOW_MANAGER_URL: ${LAB_SCHEME:-https}://${LAB_HOST}/monitor/
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${LAB_HOST}`) && PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.tls=true
      - traefik.http.services.web.loadbalancer.server.port=8080

volumes:
  traefik_acme:
    driver: local
