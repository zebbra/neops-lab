name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies (dev)
        run: uv sync --group dev --frozen

      # `.` and not an explicit file list: the lab's host scripts have no `.py`
      # extension and are reached through ruff's `extend-include` in
      # pyproject.toml, which only applies to a directory walk.
      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run pyrefly check

      - name: Run tests
        run: uv run pytest tests

      # The host scripts must import under Python 3.9 (stock macOS python3);
      # ruff at py312 would happily accept a `X | None` that breaks there.
      - name: Host scripts import under Python 3.9
        run: make py39-check

      - name: Shell entry points parse
        run: make shellcheck-syntax

      - name: Summary
        run: echo "### Ruff/pyrefly/pytest/py39/shell passed ✅" >> $GITHUB_STEP_SUMMARY

  # macOS is a supported host for the lab (see README). This job runs the
  # hermetic gates on a real Mac — stock /usr/bin/python3 (3.9), BSD userland,
  # bash 3.2 — so the portability of the host scripts is owned by CI, not by
  # whoever happens to own a Mac. It stands up no containers.
  macos:
    name: macOS host tooling
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies (dev)
        run: uv sync --group dev --frozen

      - name: Run tests
        run: uv run pytest tests

      - name: Host scripts import under the stock macOS python3
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -c "import importlib.machinery, importlib.util
          for n in ('gen_clab_topology', 'gen_device_configs', 'run_workflow', 'wait_ready', 'wait_devices'):
              l = importlib.machinery.SourceFileLoader(n, n)
              l.exec_module(importlib.util.module_from_spec(importlib.util.spec_from_loader(n, l)))
          print('ok')"

      - name: Shell entry points parse under bash 3.2
        run: |
          /bin/bash --version | head -1
          /bin/bash -n apply_cms_config && /bin/bash -n containerlab && /bin/bash -n doctor

      - name: Generator reproduces the committed parameter files (BSD userland)
        run: |
          /usr/bin/python3 ./gen_clab_topology
          git diff --exit-code -- workflow-execution-parameters/

  docker:
    name: Build lab images (no push)
    needs: lint-test
    runs-on: hetzner
    steps:
      - uses: actions/checkout@v4

      # neops-lab-frr / neops-lab-bootstrap are LOCAL-only images: every lab
      # host builds them itself, nothing is published to a registry. This job
      # exists so a broken Dockerfile fails in CI instead of on a developer's
      # first `make local-lab-up`.
      - name: Build lab images
        run: make build-docker
