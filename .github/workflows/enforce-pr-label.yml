name: Enforce PR Label

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

concurrency:
  # Scoped per PR: a repo-wide group lets two active PRs cancel each other's
  # runs of this required check, leaving both stuck on "cancelled".
  group: enforce-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce-label:
    permissions:
      pull-requests: read
      issues: read
    runs-on: hetzner
    steps:
      - uses: zebbra/actions/enforce-pr-label@enforce-pr-label/latest
