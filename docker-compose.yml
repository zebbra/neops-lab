# Engine and monitor app share one image: the public developer preview, whose
# `develop` tag the engine's CI republishes on every merge to its develop branch.
x-workflow-engine-image: &workflow-engine-image
  image: ${NEOPS_WORKFLOW_ENGINE_IMAGE:-quay.io/zebbra/neops-workflow-engine-preview:${NEOPS_ENGINE_TAG:-develop}}
  pull_policy: ${NEOPS_WORKFLOW_ENGINE_PULL_POLICY:-missing}

services:
  wait_health:
    # This checks the high-level components for health status before returning from the docker compose up -d command
    image: busybox
    depends_on:
      cms:
        condition: service_healthy
      workflow_engine:
        condition: service_healthy
      web_client:
        condition: service_healthy

  cms:
    # Override via NEOPS_CMS_IMAGE (e.g. a locally-built neops-cms-free:latest,
    # from `make -C ../neops-core build-docker flavor=cms-free`); defaults to the
    # published develop image. `pull_policy: missing` finds a local image that is
    # already present and skips the registry; force with NEOPS_CMS_PULL_POLICY.
    image: ${NEOPS_CMS_IMAGE:-quay.io/zebbra/neops-cms-free:develop}
    pull_policy: ${NEOPS_CMS_PULL_POLICY:-missing}
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=neopsapp.settings
      - DATABASE_URL=postgres://postgres:unsafe@postgres:5432/postgres
      - DJANGO_ALLOWED_HOSTS=*
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - DJANGO_SECRET_KEY=unsafe
      - CORS_ORIGIN_ALLOW_ALL=True
      - NEOPS_PLUGINS=neops_auth_static_api_key neops_auth_django neops_permissions_simple
      - DJANGO_ALLOW_ASYNC_UNSAFE=True
      # Redis backs the CMS channel layer (GraphQL subscriptions), Django cache
      # and Celery broker, as in the production compose file and the Helm
      # chart; neops-core configures a channel layer only when REDIS_URL is set.
      - REDIS_URL=redis://redis:6379
      # No quotes: in compose list form they become part of the value.
      - AUTH_PROVIDERS_CONFIG_PATH=./auth_providers_with_secret.json
      # The web client's GraphQL `appSettings.oidcConfig` query reads this file via the CMS resolver
      # (neops/core/schema.py: open(settings.OIDC_CONFIG_PATH)). When the file is missing the field
      # returns null; the web client's Angular bootstrap (APP_INITIALIZER -> OidcSecurityService.checkAuth())
      # then crashes on JSON.parse(null) and the login screen never renders. An empty-array file is the
      # "OIDC disabled, no providers" sentinel that satisfies the web client.
      - OIDC_CONFIG_PATH=/etc/neops/oidc-config.json
      # Newer neops-cms-free:develop images require an RSA keypair for RS256 JWT
      # issuance; without these paths the CMS crashes on startup (token_service
      # check_keys). Dev-only keys are generated under cms/jwt by `make lab-jwt`
      # (chained into `make local-env-init`; see the README prerequisites).
      - NEOPS_JWT_PRIVATE_KEY_PATH=/etc/neops/jwt/private.pem
      - NEOPS_JWT_PUBLIC_KEY_PATH=/etc/neops/jwt/public.pem
    volumes:
      # The scenario's OIDC config, materialised by `make scenario-resolve`.
      # `:?` and not `:-`: an unset SCENARIO must fail here, not silently pick
      # a lab. Without it compose only warns and docker would create the
      # missing bind source as an empty directory.
      - ./generated/${SCENARIO:?set SCENARIO or drive compose through make; see 'make scenarios'}/scenario/cms/oidc-config.json:/etc/neops/oidc-config.json:ro
      - ./cms/jwt:/etc/neops/jwt:ro
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        python manage.py migrate &&
        (DJANGO_SUPERUSER_PASSWORD=neops python manage.py createsuperuser --noinput --username neops --email neops@neops.io || true) &&
        (python manage.py elastic_index --create 2>&1 || true) &&
        python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8001:8000"
    healthcheck:
      # Using -L to follow redirects just in case /admin/ forwards to a login URL
      test: [ "CMD-SHELL", "curl -f -L http://localhost:8000/admin/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations and the ES index build run before the server listens;
      # ~2 minutes under amd64 emulation. Failures count after start_period,
      # so a genuinely broken CMS is reported that much later.
      start_period: 150s

  workflow_engine:
    <<: *workflow-engine-image
    environment:
      - DEBUG=True
      - NODE_ENV=development
      - NEOPS_CMS_URL=http://cms:8000/graphql
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=unsafe
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PORT=3030
      # How the engine authorizes each request: enforce | permissive | disabled.
      # @REVIEWER develop ships `disabled` (commit 6d29313, "disable authz"). Kept
      # as-is through the merge; the docs now say `disabled` too. Flip both back
      # to `enforce` if that commit was a temporary unblock for the spie work.
      - NEOPS_AUTHZ_MODE=disabled
      # SPKI PEM the engine verifies Neops RS256 tokens against — the public half
      # of the keypair `make lab-jwt` mints for the CMS, mounted below.
      - NEOPS_JWT_PUBLIC_KEY_PATH=/etc/neops/jwt/public.pem
      # Exact browser origins allowed to call this engine: the web client on
      # :8080 and the monitor app on :3031.
      - NEOPS_CORS_ORIGINS=http://localhost:8080,http://localhost:3031
    env_file:
      - cms_api_key.env
    volumes:
      - ./cms/jwt/public.pem:/etc/neops/jwt/public.pem:ro
    ports:
      - "3030:3030"
    depends_on:
      postgres:
        condition: service_healthy
      cms:
        condition: service_healthy # Ensures CMS is up before the workflow engine connects
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').request('http://localhost:3030/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => { process.exit(1); }).end();\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
      # Node start + DB migrations; slower under emulation.
      start_period: 60s

  workflow-engine-client:
    <<: *workflow-engine-image
    environment:
      # `npm run dev` needs vite, @sveltejs/kit and svelte, which are
      # devDependencies of rest/monitor-app; `npm install` omits
      # devDependencies under NODE_ENV=production.
      - NODE_ENV=development
    ports:
      - "3031:5173"
    depends_on:
      workflow_engine:
        condition: service_healthy
    working_dir: /app/rest/monitor-app
    volumes:
      # The monitor reads window.__NEOPS_CONFIG__ from this file; see invariant
      # 21 in docs/60-development/20-invariants.md.
      - ./monitor/config.js:/app/rest/monitor-app/static/config.js:ro
    command: >
      sh -c "npm install && npm run dev"

  worker:
    # Optional: the worker only makes sense with devices to reach, and you turn
    # it off to run one by hand against the same engine. Enabled by
    # COMPOSE_PROFILES in .env; `docker compose up -d worker` enables the
    # profile on the fly regardless.
    profiles: ["worker"]
    # The worker runs the PUBLISHED SDK image — this repo holds the lab, not the
    # SDK source. Override via NEOPS_WORKER_SDK_IMAGE (e.g. a locally-built
    # neops-worker-sdk:latest) to try SDK changes here before they are released;
    # `pull_policy: missing` then finds the local image and skips the registry.
    image: ${NEOPS_WORKER_SDK_IMAGE:-quay.io/zebbra/neops-worker-sdk:develop}
    pull_policy: ${NEOPS_WORKER_SDK_PULL_POLICY:-missing}
    depends_on:
      workflow_engine:
        condition: service_healthy
    environment:
      URL_BLACKBOARD: http://workflow_engine:3030
      # In-container paths (the SDK image's WORKDIR is /app):
      #   lab/generated/<scenario>/scenario/function_blocks -> the resolved
      #                          scenario tree inside this repo, bind-mounted
      #                          below at /app/lab
      #   neops/fb            -> the base function blocks, which ship INSIDE the
      #                          published neops-worker-sdk image (`COPY ./neops
      #                          neops/` in its base stage). FB discovery walks
      #                          these relative to the CWD. If discovery ever
      #                          fails with "Function block ... not found",
      #                          check the image you pinned carries /app/neops/fb.
      DIR_FUNCTION_BLOCKS: lab/generated/${SCENARIO:?set SCENARIO or drive compose through make; see 'make scenarios'}/scenario/function_blocks,neops/fb
      WORKER_NAME: simple-lab-worker
      NEOPS_BLOCKING_DETECTOR: "true"
    volumes:
      # The whole repo is the lab: mounted at /app/lab so the in-container paths
      # above resolve.
      - .:/app/lab:ro
    networks:
      - default
      - lab-net

  lab_bootstrap:
    # Built by `make build-docker-bootstrap`; the explicit tag keeps that build
    # and this service on the same image.
    image: neops-lab-bootstrap:latest
    build: ./bootstrap
    depends_on:
      workflow_engine:
        condition: service_healthy
    environment:
      ENGINE_URL: http://workflow_engine:3030
      WORKFLOWS_DIR: /workflows
      # Access token for the engine's publish route, minted by ./lab_token and
      # interpolated at `up -d` by whichever make target brings the stack up.
      NEOPS_ENGINE_TOKEN: ${NEOPS_ENGINE_TOKEN:-}
    volumes:
      - ./generated/${SCENARIO:?set SCENARIO or drive compose through make; see 'make scenarios'}/scenario/workflows:/workflows:ro
    restart: "no"

  web_client:
    # Override via NEOPS_WEB_CLIENT_IMAGE (e.g. a locally-built
    # neops-web-client:latest); defaults to the published develop image.
    # `missing` means a local image that is already present is used as-is, with
    # no registry call. Force with NEOPS_WEB_CLIENT_PULL_POLICY.
    image: ${NEOPS_WEB_CLIENT_IMAGE:-quay.io/zebbra/neops-web-client:develop}
    pull_policy: ${NEOPS_WEB_CLIENT_PULL_POLICY:-missing}
    environment:
      # Read by the entrypoint's `FRONTEND_*` env-injection. Browser-relative,
      # so the values point at host-published ports, not in-network names.
      FRONTEND_GRAPHQL_ENDPOINT: "http://localhost:8001/graphql"
      FRONTEND_FILEAPI_ENDPOINT: "http://localhost:8001/"
      FRONTEND_DEVMODE: "true"
      # Workflow manager (monitor app) served by the workflow-engine-client
      # service above, published on host port 3031.
      FRONTEND_WORKFLOW_MANAGER_URL: "http://localhost:3031"
    ports:
      - "8080:8080"
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: unsafe
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Same major as the production compose file and the Helm chart.
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    environment:
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # Heap is 2g (-Xms2g -Xmx2g); 4g covers off-heap and page cache. On
    # Docker Desktop this limit competes with the SR Linux nodes for the VM.
    cpus: 2
    mem_limit: 4g
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -f http://localhost:9200 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      # A cold ES 8 JVM takes ~60 s to listen on a loaded host; without a
      # grace period the retries are used up first and every dependent
      # service aborts with "dependency elasticsearch failed to start".
      start_period: 90s

volumes:
  elasticsearch:
    driver: local
  postgres_data:
    driver: local

networks:
  # `default` carries a fixed subnet so this project's own network is never
  # auto-allocated: docker hands auto-allocated networks the next free /16 from
  # its 172.16/12 pool, and on a host with many projects that can be
  # 172.30.0.0/16 — which blocks lab-net's fixed 172.30.0.0/24 with "Pool
  # overlaps". Pinned here, the allocator never competes with the lab. (lab-net
  # below is external, so compose allocates nothing for it either way.)
  default:
    ipam:
      config:
        - subnet: 172.30.1.0/24

  # Nothing removes this network. `make lab-net` creates it and `containerlab
  # deploy` finds it already there (the generated topology's `mgmt` block names
  # it and its subnet, gen_clab_topology.LAB_SUBNET). `external` means compose
  # attaches and never creates or — crucially — REMOVES it, so `make
  # local-env-down` cannot pull the network out from under a running lab; on the
  # device side `local-lab-down` passes `--keep-mgmt-net` for the mirror reason.
  # It must exist before the worker starts, which is why `lab-net` is a
  # prerequisite of the targets that start one.
  # Not restating the subnet here is the point: one source.
  lab-net:
    external: true
