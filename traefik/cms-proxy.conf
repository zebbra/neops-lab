# Path-prefix shim in front of the CMS for host mode.
#
# Traefik forwards /cms/* here WITHOUT stripping. nginx strips /cms when talking
# to Django and rewrites absolute Location / HTML root paths back to /cms/… —
# the CMS image does not honour FORCE_SCRIPT_NAME from the environment, so
# admin redirects like Location: /admin/login/ would otherwise hit the web
# client catch-all at /.

server {
    listen 80;
    server_name _;

    # Django runserver can be slow under emulation; avoid premature 504s.
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location = /cms {
        return 301 /cms/;
    }

    location /cms/ {
        # Trailing slash on proxy_pass drops the /cms prefix toward Django.
        proxy_pass http://cms:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /cms;
        proxy_set_header X-Script-Name /cms;

        # Location: /admin/login/  ->  Location: /cms/admin/login/
        # Location: http://host/admin/...  ->  /cms/admin/...
        proxy_redirect ~^https?://[^/]+(/.*)$ /cms$1;
        proxy_redirect / /cms/;

        # Admin HTML references /static/… and /admin/… at the site root; rewrite
        # those so assets and forms stay under /cms. Disable upstream gzip so
        # sub_filter can see the body.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/static/' 'href="/cms/static/';
        sub_filter 'src="/static/' 'src="/cms/static/';
        sub_filter 'href="/admin/' 'href="/cms/admin/';
        sub_filter 'action="/admin/' 'action="/cms/admin/';
        sub_filter 'url(/static/' 'url(/cms/static/';
        sub_filter '"/graphql"' '"/cms/graphql"';
        sub_filter "'/graphql'" "'/cms/graphql'";
    }
}
