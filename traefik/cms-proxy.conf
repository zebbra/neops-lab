# Path-prefix shim in front of the CMS for host mode (OpenResty).
#
# Traefik forwards /cms/* here without stripping. We strip /cms toward Django
# and rewrite Location (and common root-absolute HTML hrefs) back under /cms.
# Plain nginx proxy_redirect is unreliable with Django's path-only Locations.

server {
    listen 80;
    server_name _;

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location = /cms {
        return 301 /cms/;
    }

    location /cms/ {
        rewrite ^/cms/?(.*)$ /$1 break;
        proxy_pass http://cms:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /cms;
        proxy_set_header X-Script-Name /cms;

        # Do not let nginx "help" with Location — Lua owns it.
        proxy_redirect off;

        header_filter_by_lua_block {
            local loc = ngx.header["Location"]
            if not loc or loc == "" then
                return
            end

            local function under_cms(path)
                if path:sub(1, 5) == "/cms/" or path == "/cms" then
                    return path
                end
                if path:sub(1, 1) == "/" then
                    return "/cms" .. path
                end
                return path
            end

            -- Absolute URL on any host → keep path only
            local path = loc:match("^https?://[^/]+(/.*)$")
            if path then
                loc = under_cms(path)
            else
                loc = under_cms(loc)
            end

            -- Login redirect target is also root-absolute
            loc = loc:gsub("([?&]next=)/admin", "%1/cms/admin")
            loc = loc:gsub("([?&]next=)/$", "%1/cms/")

            ngx.header["Location"] = loc
        }

        # Admin HTML still points at /static, /djstatic and /admin at the site root.
        # CMS images use STATIC_URL=/djstatic/ (not /static/).
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/static/' 'href="/cms/static/';
        sub_filter 'src="/static/' 'src="/cms/static/';
        sub_filter 'url(/static/' 'url(/cms/static/';
        sub_filter 'href="/djstatic/' 'href="/cms/djstatic/';
        sub_filter 'src="/djstatic/' 'src="/cms/djstatic/';
        sub_filter 'url(/djstatic/' 'url(/cms/djstatic/';
        sub_filter 'href="/admin/' 'href="/cms/admin/';
        sub_filter 'action="/admin/' 'action="/cms/admin/';
    }
}
