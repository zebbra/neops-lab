# HTTPS overlay for host mode. Loaded when LAB_SCHEME is unset or `https`.
#
# Adds :443, HTTP→HTTPS redirect, ACME resolver registration, and swaps the
# file-provider config to traefik/dynamic.https.yml (self-signed TLS).

services:
  traefik:
    command: !override
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.basePath=/traefik
      - --log.level=INFO
      - --accesslog=true
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-noreply@localhost}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./traefik/dynamic.https.yml:/etc/traefik/dynamic.yml:ro
      - traefik_acme:/acme

volumes:
  traefik_acme:
    driver: local
