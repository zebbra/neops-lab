copyright: Copyright &copy; Zebbra AG
edit_uri: edit/develop/docs
extra:
  social:
  - icon: fontawesome/solid/house
    link: https://zebbra.ch
    name: Zebbra
extra_css:
- assets/extra.css
extra_javascript:
- assets/extra.js
hooks:
- .make_scripts/mkdocs-documentation/hooks/inline_nav_include.py
- .make_scripts/mkdocs-documentation/hooks/fix_symlinks.py
- .make_scripts/mkdocs-documentation/hooks/submodule_authors.py
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- admonition
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
      name: mermaid
- pymdownx.inlinehilite
- pymdownx.snippets:
    base_path:
    - !relative
    check_paths: true
    restrict_base_path: false
- pymdownx.emoji:
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
    emoji_index: !!python/name:material.extensions.emoji.twemoji
- pymdownx.tabbed:
    alternate_style: true
- attr_list
- md_in_html
- pymdownx.tasklist:
    custom_checkbox: true
- abbr
- smarty
- pymdownx.smartsymbols
- pymdownx.magiclink
- pymdownx.betterem
- def_list
nav:
- Start: index.md
- Get started:
  - Get started: getting-started/index.md
  - Prerequisites: getting-started/10-prerequisites.md
  - Quickstart: getting-started/20-quickstart.md
  - Your first discovery: getting-started/30-first-discovery.md
- Concepts:
  - Concepts: 10-concepts/index.md
  - Architecture: 10-concepts/10-architecture.md
  - Topology as source of truth: 10-concepts/20-topology.md
  - Discovery: 10-concepts/30-discovery.md
  - The /app/lab mount: 10-concepts/40-container-paths.md
- Operating the lab:
  - Operating the lab: 20-operations/index.md
  - Make targets: 20-operations/10-make-targets.md
  - Images: 20-operations/20-images.md
  - Adding a device: 20-operations/30-adding-a-device.md
  - Troubleshooting: 20-operations/40-troubleshooting.md
- Development:
  - Development: 60-development/index.md
  - Dev setup: 60-development/10-dev-setup.md
  - Invariants: 60-development/20-invariants.md
- Appendix:
  - Appendix: 99-appendix/index.md
  - Glossary: 99-appendix/glossary.md
  - NeOps ecosystem: 99-appendix/neops-ecosystem.md
plugins:
- search
- include_dir_to_nav
- document-dates:
    exclude:
    - coming-soon.md
    position: bottom
    type: datetime
- exclude:
    glob:
    - '*.tmp'
    - '*.pdf'
    - '*.gz'
    - node_modules
    - '**/node_modules/*'
    - .venv
    - '**/.venv/*'
    - bootstrap/*
    - clab/*
    - cms/*
    - devices/*
    - function_blocks/*
    - scope/*
    - tests/*
    - workflows/*
    - workflow-execution-parameters/*
    regex:
    - .*\.(tmp|bin|tar)$
repo_url: https://github.com/zebbra/neops-lab
site_name: NeOps Lab
theme:
  custom_dir: docs/override
  favicon: assets/favicon.png
  features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - header.autohide
  - announce.dismiss
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.path
  - navigation.top
  - navigation.tracking
  - navigation.instant
  - search.share
  - search.suggest
  - search.highlight
  - content.action.edit
  - toc.follow
  logo: assets/logo.svg
  name: material
  palette:
  - media: (prefers-color-scheme)
    toggle:
      icon: material/link
      name: Switch to light mode
  - accent: indigo
    media: '(prefers-color-scheme: light)'
    primary: blue grey
    scheme: default
    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode
  - accent: deep orange
    media: '(prefers-color-scheme: dark)'
    primary: black
    scheme: slate
    toggle:
      icon: material/toggle-switch-off
      name: Switch to system preference
